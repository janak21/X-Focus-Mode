<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <h2>X Focus Mode</h2>
    <p>Distraction-free reading</p>

    <div class="toggle-group">
      <div class="toggle-row">
        <span class="toggle-label">Hide Sidebars</span>
        <div class="toggle-control">
          <label class="switch">
            <input type="checkbox" id="focusToggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Wide Layout</span>
        <div class="toggle-control">
          <label class="switch">
            <input type="checkbox" id="wideToggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div class="toggle-row">
        <span class="toggle-label">Zen Typography</span>
        <div class="toggle-control">
          <label class="switch">
            <input type="checkbox" id="zenToggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
